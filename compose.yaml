name: ecopoints
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecopoints}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecopoints}
      POSTGRES_DB: ${POSTGRES_DB:-ecopoints}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seeds/001_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecopoints} -d ${POSTGRES_DB:-ecopoints}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci --workspace apps/api && npm run dev:api"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-ecopoints}:${POSTGRES_PASSWORD:-ecopoints}@db:5432/${POSTGRES_DB:-ecopoints}
      CORS_ORIGIN: http://localhost:3001
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
  api_node_modules: